# NATS nkey authorization — generated by lyra-acl genkeys
# Spec: artifacts/specs/706-per-role-nkeys-acls-spec.mdx
# TODO(ADR-045): ACL for roxabi-nats SDK identities intentionally omitted
#                until the SDK extraction lands — rerun this script then.
# DO NOT edit manually — regenerate with: sudo env "PATH=$PATH" lyra-acl genkeys --regenerate
authorization {
  default_permissions: {
    publish:   { deny: [">"] }
    subscribe: { deny: [">"] }
  }
  users: [
    {
      nkey: "UDETHUB"
      # hub
      permissions: {
        publish:   { allow: ["lyra.outbound.telegram.>","lyra.outbound.discord.>","lyra.voice.tts.request.>","lyra.voice.stt.request.>","lyra.llm.request","lyra.image.generate.request","lyra.clipool.cmd","lyra.clipool.control","lyra.audit.>","$JS.API.>","$KV.lyra-state.>"] }
        subscribe: { allow: ["lyra.inbound.telegram.>","lyra.inbound.discord.>","lyra.voice.tts.heartbeat","lyra.voice.stt.heartbeat","lyra.llm.health.*","lyra.system.ready","lyra.image.heartbeat","lyra.clipool.heartbeat","_inbox.hub.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETTELEGRAMADAPTER"
      # telegram-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.telegram.>","lyra.system.ready","$JS.API.>"] }
        subscribe: { allow: ["lyra.outbound.telegram.>","_inbox.telegram-adapter.>","_inbox.telegram-adapter.*.*","$KV.lyra-state.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETDISCORDADAPTER"
      # discord-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.discord.>","lyra.system.ready","$JS.API.>"] }
        subscribe: { allow: ["lyra.outbound.discord.>","_inbox.discord-adapter.>","_inbox.discord-adapter.*.*","$KV.lyra-state.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETVOICETTS"
      # voice-tts
      permissions: {
        publish:   { allow: ["lyra.voice.tts.heartbeat","lyra.system.ready","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.voice.tts.request","lyra.voice.tts.request.>","_inbox.voice-tts.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETVOICESTT"
      # voice-stt
      permissions: {
        publish:   { allow: ["lyra.voice.stt.heartbeat","lyra.system.ready","_inbox.hub.>","_inbox.voice-client.>"] }
        subscribe: { allow: ["lyra.voice.stt.request","lyra.voice.stt.request.>","_inbox.voice-stt.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETLLMWORKER"
      # llm-worker
      permissions: {
        publish:   { allow: ["lyra.llm.health.*","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.llm.request"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETIMAGEWORKER"
      # image-worker
      permissions: {
        publish:   { allow: ["lyra.image.heartbeat","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.image.generate.request","_inbox.image-worker.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETMONITOR"
      # monitor
      permissions: {
        publish:   { allow: ["lyra.monitor.>"] }
        subscribe: { allow: ["lyra.monitor.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETCLIPOOLWORKER"
      # clipool-worker
      permissions: {
        publish:   { allow: ["lyra.clipool.heartbeat","lyra.system.ready","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.clipool.cmd","lyra.clipool.control","_inbox.clipool-worker.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETVOICECLIENT"
      # voice-client
      permissions: {
        publish:   { allow: ["lyra.voice.stt.request"] }
        subscribe: { allow: ["_inbox.voice-client.>"] }
        allow_responses: true
      }
    }
  ]
}
