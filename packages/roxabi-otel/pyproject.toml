[project]
name = "roxabi-otel"
version = "0.1.0"
description = "OpenTelemetry lifecycle hooks for Roxabi NATS workers (#2069)"
readme = "AGENTS.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "Roxabi SAS", email = "mickael@bouly.io" }]
dependencies = [
    "roxabi-contracts>=0.1.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30.0",
]

[project.optional-dependencies]
testing = ["pytest>=8.4", "pytest-asyncio>=0.24"]

[project.urls]
Repository = "https://github.com/Roxabi/roxabi-factory"
Issues = "https://github.com/Roxabi/roxabi-factory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_otel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]