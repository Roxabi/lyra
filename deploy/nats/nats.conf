# NATS Server — Lyra by Roxabi
# Machine 1 (Hub) configuration
# Install to: /etc/nats/nats.conf
# Installed by: lyra/deploy/nats/install.sh

# Bind to localhost — all clients (hub, adapters) run on the same machine.
# UFW blocks external 4222 by default; no LAN bind needed for single-machine.
host: 127.0.0.1
port: 4222

pid_file: "/run/nats-server/nats-server.pid"

# ── TLS ────────────────────────────────────────────────────────────────────
# Cipher suites are TLS 1.3 only — connections using TLS 1.2 or older are
# rejected at the TLS handshake layer.
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file:  "/etc/nats/certs/server.key"
  ca_file:   "/etc/nats/certs/ca.crt"
  timeout:   5

  # TLS 1.3-only cipher suites (Go rejects TLS 1.2 when only these are listed)
  cipher_suites: [
    "TLS_AES_128_GCM_SHA256"
    "TLS_AES_256_GCM_SHA384"
    "TLS_CHACHA20_POLY1305_SHA256"
  ]
}

# ── nkey auth ──────────────────────────────────────────────────────────────
# Public keys written by lyra-acl genkeys into /etc/nats/nkeys/auth.conf
# Do not edit auth.conf manually — regenerate with: sudo env "PATH=$PATH" lyra-acl genkeys --regenerate
include "nkeys/auth.conf"

# ── Resource limits ────────────────────────────────────────────────────────
max_connections: 20      # 10 registered identities (~9 peak) + headroom; reject unexpected connections fast
max_payload:     52428800 # 50MB — supports large audio, images, video over NATS

# ── JetStream ───────────────────────────────────────────────────────────────
# Required for the KV readiness probe (hub.ready in lyra-state bucket).
# Both host (systemd) and container (Quadlet) installs use this stanza.
# Container: lyra-jetstream.volume bind-mounts ~/.lyra/nats/jetstream → /var/lib/nats/jetstream.
# The -js CLI flag was removed in #1055; store_dir config is now the sole activation path.
jetstream {
  store_dir: "/var/lib/nats/jetstream"
}

# ── Monitoring ─────────────────────────────────────────────────────────────
# HTTP monitoring — localhost only, never exposed externally.
# Polled by lyra-monitor via check_nats_varz() for auth_errors + slow_consumers.
http: 127.0.0.1
http_port: 8222

logtime: true
