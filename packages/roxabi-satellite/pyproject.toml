[project]
name = "roxabi-satellite"
version = "0.1.0"
description = "Shared NATS satellite plumbing for Roxabi NATS workers (voice, image, llm, socialmedia)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "Roxabi SAS", email = "mickael@bouly.io" }]
dependencies = [
    "roxabi-blobs>=0.1.2",
    "roxabi-contracts>=0.12.0",
    "roxabi-nats>=0.4.2",
    "pydantic>=2.13",
]

[project.optional-dependencies]
testing = ["pytest>=8.4"]

[project.urls]
Repository = "https://github.com/Roxabi/roxabi-factory"
Issues = "https://github.com/Roxabi/roxabi-factory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_satellite"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]