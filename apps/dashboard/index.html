<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factory Dashboard</title>
    <script>
      // Pre-paint theme bootstrap — sets data-theme before the bundle loads so
      // the correct light/dark tokens paint without a flash (FOUC). Runtime
      // ownership of data-theme belongs to the Astryx <Theme mode> provider
      // (src/main.tsx); this only handles the initial paint. The storage key
      // must match THEME_STORAGE_KEY in src/lib/theme.ts.
      (() => {
        const el = document.documentElement;
        let t = "dark";
        try {
          t = localStorage.getItem("factory-dashboard:theme") === "light" ? "light" : "dark";
        } catch {}
        el.setAttribute("data-theme", t);
        el.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
