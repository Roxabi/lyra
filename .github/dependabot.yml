version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Majors grouped too: dependabot treats 0.x minor bumps (uvicorn, ruff…)
      # as major-equivalent, so without this group they each open an individual
      # PR — exactly the population of the 2026-07 zombie-PR fan-out.
      majors:
        update-types: [major]
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
    # semver-*-days cooldowns are pip-only — dependabot rejects them for
    # github-actions/docker, and ONE invalid property disables the whole file
    # (live check-run ".github/dependabot.yml" red after #2136).
    cooldown:
      default-days: 3

  # Dockerfile pins ghcr.io/roxabi/base* by sha256 digest — without this
  # ecosystem the base-image update path is fully manual and digests rot
  # until they surface as runtime breakage on M1.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # semver-*-days: pip-only (see github-actions block above).
    cooldown:
      default-days: 3
    # The builder image must satisfy pyproject requires-python (>=3.12,<3.13):
    # a major/minor python bump breaks `uv sync` in docker-build (staging red
    # 2026-07-03, #2160 bumped 3.12→3.14). Patch bumps only.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
