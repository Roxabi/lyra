repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files
    args: ['--maxkb=500']
- repo: local
  hooks:
  - id: lint
    name: lint
    entry: uv run ruff check .
    language: system
    pass_filenames: false
  - id: typecheck
    name: typecheck
    entry: uv run pyright
    language: system
    pass_filenames: false
  - id: check-file-length
    name: check-file-length
    entry: tools/check_file_length.sh
    language: system
    pass_filenames: false
  - id: check-file-length-roxabi-nats
    name: check-file-length (roxabi-nats)
    entry: bash -c "QG_FILE_ROOT=packages/roxabi-nats/src/ QG_FILE_EXEMPTIONS=packages/roxabi-nats/tools/file_exemptions.txt tools/check_file_length.sh"
    language: system
    pass_filenames: false
  - id: check-file-length-roxabi-contracts
    name: check-file-length (roxabi-contracts)
    entry: bash -c "QG_FILE_ROOT=packages/roxabi-contracts/src/ QG_FILE_EXEMPTIONS=packages/roxabi-contracts/tools/file_exemptions.txt tools/check_file_length.sh"
    language: system
    pass_filenames: false
  - id: check-folder-size
    name: check-folder-size
    entry: tools/check_folder_size.sh
    language: system
    pass_filenames: false
  - id: check-duplicate-test-basenames
    name: check-duplicate-test-basenames
    entry: tools/check_duplicate_test_basenames.sh
    language: system
    pass_filenames: false
  - id: import-layers
    name: import-layers
    entry: uv run lint-imports
    language: system
    pass_filenames: false
  - id: codes-sync
    name: codes-sync (regenerate error-codes.md)
    entry: uv run python packages/roxabi-contracts/scripts/check_codes_sync.py --write
    language: system
    pass_filenames: false
    files: ^packages/roxabi-contracts/(src/roxabi_contracts/errors\.py|docs/error-codes\.md|scripts/check_codes_sync\.py)$
  - id: trufflehog
    name: trufflehog secret scan
    entry: bash -c "[ -d .git ] && trufflehog git file://. --fail || true"
    language: system
    pass_filenames: false
    stages:
    - pre-push
  - id: check-single-write-tool-display-config
    name: check-single-write-tool-display-config
    entry: tools/check_single_write_tool_display_config.sh
    language: system
    pass_filenames: false
    stages:
    - pre-push
  - id: check-no-runtime-toml-bots
    name: check-no-runtime-toml-bots
    entry: tools/check_no_runtime_toml_bots.sh
    language: system
    pass_filenames: false
    stages:
    - pre-push
  - id: license
    name: license check
    entry: uv run tools/license_check.py
    language: system
    pass_filenames: false
    stages:
    - pre-push
  - id: architecture-snapshot
    name: architecture snapshot freshness
    entry: tools/check_architecture_snapshot.sh
    language: system
    pass_filenames: false
    stages:
    - pre-push
  - id: acl-specs-drift
    name: ACL spec/fixture drift (acl-matrix.json is source of truth)
    entry: scripts/check-acl-specs-drift.sh
    language: system
    pass_filenames: false
    stages:
    - pre-push
