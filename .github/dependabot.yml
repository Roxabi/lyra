version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Majors grouped too: dependabot treats 0.x minor bumps (uvicorn, ruff…)
      # as major-equivalent, so without this group they each open an individual
      # PR — exactly the population of the 2026-07 zombie-PR fan-out.
      majors:
        update-types: [major]
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3

  # Dockerfile pins ghcr.io/roxabi/base* by sha256 digest — without this
  # ecosystem the base-image update path is fully manual and digests rot
  # until they surface as runtime breakage on M1.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3
