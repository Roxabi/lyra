version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      # Majors grouped too: dependabot treats 0.x minor bumps (uvicorn, ruff…)
      # as major-equivalent, so without this group they each open an individual
      # PR — exactly the population of the 2026-07 zombie-PR fan-out.
      majors:
        update-types: [major]
    labels:
      - dependencies
    cooldown:
      default-days: 3
      semver-major-days: 3
      semver-minor-days: 3
      semver-patch-days: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
    labels:
      - dependencies
      - ci
    # semver-*-days cooldowns are pip-only — dependabot rejects them for
    # github-actions/docker, and ONE invalid property disables the whole file
    # (live check-run ".github/dependabot.yml" red after #2136).
    cooldown:
      default-days: 3

  # Dockerfile pins ghcr.io/roxabi/base* by sha256 digest — without this
  # ecosystem the base-image update path is fully manual and digests rot
  # until they surface as runtime breakage on M1.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
    # semver-*-days: pip-only (see github-actions block above).
    cooldown:
      default-days: 3
    ignore:
      # The builder base image (Dockerfile line 1) MUST stay on python 3.12.x —
      # requires-python = ">=3.12,<3.13". A 3.13/3.14 bump makes uv build the
      # venv against a managed interpreter outside /app, so /app/.venv/bin/python
      # dangles in the base-* runtime stages (docker-build red, staging-wide,
      # 2026-07-02 via #2160). Allow only patch bumps within 3.12.x; base-*
      # digest bumps (roxabi/base, base-svc) are a different dependency-name and
      # stay enabled.
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
