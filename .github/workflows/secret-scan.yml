name: Secret Scan

permissions:
  contents: read
  checks: read
  pull-requests: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  # Merge queue entries run checks on temporary gh-readonly-queue/staging/*
  # refs. The required "trufflehog" context MUST report on merge_group or
  # every queue entry times out (repo-wide merge deadlock).
  # On merge_group the action's BASE/HEAD autodetection has no branch → empty args → trufflehog scans FULL history (~13s): strictly more coverage than a diff scan, not less.
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: false   # never preempt a security scan

jobs:
  classify:
    name: Classify push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      path: ${{ steps.out.outputs.path }}
    steps:
      - id: out
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          path=naked
          prs="$(gh api "repos/${REPO}/commits/${SHA}/pulls")"
          n="$(printf '%s' "$prs" | jq --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)] | length')"
          if [ "$n" -gt 0 ]; then
            head="$(printf '%s' "$prs" | jq -r --arg sha "$SHA" '[.[] | select(.merged == true and .merge_commit_sha == $sha)][0].head.sha')"
            conc="$(gh api --paginate "repos/${REPO}/commits/${head}/check-runs" --jq '[.check_runs[] | select((.name | ascii_downcase) == "ci") | .conclusion] | map(select(. == "success")) | if length > 0 then "success" else "missing" end')"
            if [ "$conc" = "success" ]; then
              path=pr-merge
            fi
          fi
          echo "path=${path}" >> "$GITHUB_OUTPUT"
          echo "landing path: ${path}"

  trufflehog:
    needs: [classify]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && (github.event_name != 'push' || needs.classify.outputs.path == 'naked')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6
        with:
          fetch-depth: 0

      # Full-history verified scan + exact-Raw allowlist (security/trufflehog-allowlist.txt).
      # tests/ stay in scope — allowlist is not path exclusion (past test-file leaks).
      - name: TruffleHog secret scan (allowlist-aware)
        env:
          # Pin image tag used by tools/trufflehog_with_allowlist.sh (same as prior action pin era).
          TRUFFLEHOG_VERSION: "3.96.0"
        run: |
          set -euo pipefail
          chmod +x tools/trufflehog_with_allowlist.sh
          tools/trufflehog_with_allowlist.sh
