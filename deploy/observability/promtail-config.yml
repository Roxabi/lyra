# Factory Promtail — ships operator.log + filtered user journald to Loki (ADR-093).

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: info

positions:
  filename: /promtail-positions/positions.yaml

clients:
  - url: http://factory-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: factory-operator
    static_configs:
      - targets: [localhost]
        labels:
          job: factory-operator
          channel: operator
          __path__: /var/log/factory/operator.log
    pipeline_stages:
      - json:
          expressions:
            ts: ts
            event: event
            user: user
            host: host
      - labels:
          event:
          user:
          host:
      - timestamp:
          source: ts
          format: RFC3339

  - job_name: factory-journal
    journal:
      json: false
      max_age: 168h
      path: /var/log/journal
      labels:
        job: factory-journal
        channel: journald
    relabel_configs:
      - source_labels: [__journal__systemd_user_unit]
        target_label: systemd_unit
      - source_labels: [__journal_syslog_identifier]
        target_label: syslog_id
      - source_labels: [__journal__hostname]
        target_label: hostname
      - source_labels: [systemd_unit]
        regex: (factory-.*|voicecli-.*|factory-quadlet-sync|factory-post-autoupdate|factory-deploy-failure|factory-operator-logrotate|podman-auto-update)\.service
        action: keep