# .claude/stack.yml — dev-core stack configuration
schema_version: "1.0"

runtime: python
package_manager: uv

backend:
  framework: typer
  path: src/factory

build:
  formatter: ruff
  formatter_config: pyproject.toml
  formatter_fix_cmd: "uv run ruff format . && uv run ruff check --fix ."

testing:
  unit: pytest

lsp:
  enabled: true
  server: pyright

deploy:
  platform: podman

docs:
  framework: none
  path: docs
  format: md

commands:
  dev: uv run factory
  test: uv run pytest
  lint: uv run ruff check .
  format: uv run ruff format .
  typecheck: uv run pyright
  install: uv sync
  worktree_setup: tools/worktree-setup.sh

artifacts:
  analyses: artifacts/analyses
  specs: artifacts/specs
  frames: artifacts/frames
  plans: artifacts/plans

standards:
  architecture: docs/architecture
  deployment: docs/DEPLOYMENT.md
  configuration: docs/CONFIGURATION.md
  troubleshooting: docs/GETTING-STARTED.md
  contributing: docs/GETTING-STARTED.md

quality_gates:
  file_length:
    enabled: true
    max_lines: 300
    metric: sloc
    globs: ["src/**/*.py"]
    exemptions_file: tools/file_exemptions.txt

  folder_size:
    enabled: true
    max_files: 15
    globs: ["src/**"]
    exemptions_file: tools/folder_exemptions.txt

  duplicate_test_basenames:
    enabled: true
    script: tools/check_duplicate_test_basenames.sh
    source: pyproject.toml [tool.pytest.ini_options].testpaths

  import_layers:
    enabled: true
    stage: pre-push
    config: .importlinter

  doc_drift:
    enabled: true
    script: tools/check_doc_drift.py

  doc_semantic_drift:
    enabled: true
    script: tools/check_doc_semantic_drift.py

  no_runtime_toml_bots:
    enabled: true
    script: tools/check_no_runtime_toml_bots.sh

  architecture_snapshot:
    enabled: true
    stage: pre-push
    script: tools/check_architecture_snapshot.sh

  debt_expiry:
    enabled: true
    stage: pre-push
    script: tools/check_debt_expiry.sh

  hardcoded_constants:
    enabled: true
    script: tools/check_hardcoded_constants.sh
    description: block new hardcoded numeric literals in src/factory/core/ (grandfather baseline burned down → retired, #1654/#1698/#1706)

  file_exemptions:
    enabled: true
    script: tools/check_file_exemptions.sh
    description: every entry in file_exemptions.txt must have a non-expired expires=YYYY-MM-DD token

  test_sleep:
    enabled: true
    stage: pre-push
    script: tools/check_test_sleep.sh

  secrets_drift:
    enabled: true
    stage: pre-push
    script: tools/check_secrets_drift.sh
    description: assert unit Secret= names ⊆ quadlet.toml required_secrets, quadlet.toml == manifest, factory-nats-* seeds have acl-matrix factory+container identities, and required_secrets ↔ secrets-policy.toml [secret.*] (check d, #1901) (changes under deploy/)

  volumes_table:
    enabled: true
    stage: pre-push
    script: tools/check_volumes_table.sh
    description: verify deployment.md Volumes table prose matches Volume= directives in adapter quadlet templates

  quadlet_manifest_install:
    enabled: true
    stage: pre-push
    script: tools/check_quadlet_manifest_install.sh
    description: bidirectional manifest↔install — every container/volume/network/pod declared in deploy/quadlet.toml is wired into Makefile quadlet-install (forward, #1867), AND every on-disk unit file in deploy/quadlet/ is declared in quadlet.toml (reverse — orphan-install guard, #1901)

  secrets_source:
    enabled: true
    stage: pre-push
    script: tools/check_secrets_source.sh
    description: assert every nats-seed/required secret in secrets-policy.toml has its source file under the factory data dir; skip gracefully when the data dir is absent (CI/dev). optional secrets WARN, not fail (#1901)

  str_exc_bus_bound:
    enabled: true
    script: tools/check_str_exc_bus_bound.sh
    description: block str(exc)/f"{exc}"/repr(exc) from flowing into SanitizedError construction or NATS-bus-bound message fields (SanitizedError discipline #1212, ADR-073)

  omp_pin_lockstep:
    enabled: true
    script: tools/check_omp_pin_lockstep.sh
    description: assert the omp release pin stays in lockstep across the three files — OMP_SHA256 (deploy/omp-base/Containerfile) == _PINNED_SHA256 (src/factory/adapters/omp/_rpc_digest.py) and OMP_VERSION == Dockerfile factory-omp-base tag — so a version bump can't ship a partial pin → runtime DigestMismatchError (#1873)
