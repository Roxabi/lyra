[meta]
tool = "factory"
uid = 1500

[component.nats]
container = "factory-nats.container"
required_secrets = []
host_roles = ["factory-hub"]

[component.hub]
container = "factory-hub.container"
required_secrets = ["factory-nats-hub", "factory_otel_token"]
host_roles = ["factory-hub"]

[component.telegram]
container = "factory-telegram.container"
required_secrets = ["factory-nats-telegram", "factory_blobstore_token"]
host_roles = ["factory-hub"]
template = true

[component.discord]
container = "factory-discord.container"
required_secrets = ["factory-nats-discord", "factory_blobstore_token"]
host_roles = ["factory-hub"]
template = true

[component.dashboard]
container = "factory-dashboard.container"
required_secrets = ["factory-nats-web", "factory_otel_token"]
host_roles = ["factory-hub"]

[component.clipool]
container = "factory-clipool.container"
required_secrets = ["factory-nats-clipool", "factory-claude-oauth", "factory_otel_token"]
host_roles = ["factory-hub"]

[component.gh-helper]
container = "factory-gh-helper.container"
required_secrets = ["factory-gh-pem", "factory-nats-gh-helper"]
host_roles = ["factory-hub"]

[component.turn-writer]
container = "factory-turn-writer.container"
required_secrets = ["factory-nats-turn-writer"]
host_roles = ["factory-hub"]

[component.blobstore]
container = "factory-blobstore.container"
required_secrets = ["factory-nats-blobstore", "factory_blobstore_token"]
host_roles = ["factory-hub"]

[component.omp]
container = "factory-omp.container"
host_roles = ["factory-hub"]
required_secrets = ["factory-nats-omp", "factory-litellm-key", "factory_otel_token"]

[component.socialmedia-adapter]
container = "factory-socialmedia-adapter.container"
host_roles = ["factory-hub"]
required_secrets = ["factory-nats-socialmedia", "factory-socialmedia-api-key", "factory_blobstore_token"]

[component.ingress]
container = "factory-ingress.container"
host_roles = ["factory-hub"]
required_secrets = [
  "factory-nats-ingress",
  "factory-ingress-github-webhook",
  "factory-ingress-cloudflare-webhook",
  "factory_otel_token",
]

[component.cloudflared]
container = "factory-cloudflared.container"
host_roles = ["factory-hub"]
required_secrets = []

[component.loki]
container = "factory-loki.container"
required_secrets = []
host_roles = ["factory-hub"]

[component.promtail]
container = "factory-promtail.container"
required_secrets = []
host_roles = ["factory-hub"]

# Langfuse stack — optional / deferred in otel-raw v1 (ADR-097). disabled = true:
# units stay in deploy/quadlet/ for manual opt-in; converge/install skip them.
[component.langfuse-postgres]
container = "factory-langfuse-postgres.container"
required_secrets = []
host_roles = ["factory-hub"]
disabled = true

[component.langfuse-clickhouse]
container = "factory-langfuse-clickhouse.container"
