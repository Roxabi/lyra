[Timer]
# #1989: staggered to *:4/5 (was *:0/5). At *:0/5 this fired in-phase with
# factory-quadlet-sync.timer (also *:0/5) — podman-auto-update restarts
# containers directly, OUTSIDE converge.sh's flock, so the two collided and
# bounced each container twice ~1s apart (omp SIGKILL, hub WAL crash, telegram
# teardown race). At *:4/5 it fires after factory-post-autoupdate (*:2/5) has
# already run the converge for the new image, so it lands as a trailing
# rollback-on-healthcheck safety net instead of a primary restarter. Same
# staggering rationale as factory-post-autoupdate's +2min offset (#1751).
OnCalendar=
OnCalendar=*:4/5
RandomizedDelaySec=0
