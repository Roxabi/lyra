[project]
name = "roxabi-blobs"
version = "0.1.0"
description = "Content-addressed BlobStore (Flat-FS + SQLite manifest) for the Roxabi plugin ecosystem"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Roxabi SAS", email = "mickael@bouly.io" }]
dependencies = [
    "pydantic>=2.13",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
testing = ["pytest>=8.4", "pytest-asyncio>=1.1", "pytest-cov>=6.0"]

[project.urls]
Repository = "https://github.com/Roxabi/lyra"
Issues = "https://github.com/Roxabi/lyra/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_blobs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
