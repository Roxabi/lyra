# Git hooks: upstream hygiene + stack.yml quality gates via scripts/qg.
# Gate list and order: .claude/stack.yml → qg.run_order
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-merge-conflict
  - id: check-added-large-files
    args: ['--maxkb=500']
- repo: local
  hooks:
  - id: quality-gates-pre-commit
    name: quality gates (stack.yml pre-commit)
    entry: scripts/qg run --stage pre-commit
    language: system
    pass_filenames: false
  - id: quality-gates-pre-push
    name: quality gates (stack.yml pre-push)
    entry: scripts/qg run --stage pre-push
    language: system
    pass_filenames: false
    stages:
    - pre-push