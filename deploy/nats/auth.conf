authorization {
  default_permissions: {
    publish:   { deny: [">"] }
    subscribe: { deny: [">"] }
  }
  users: [
    {
      nkey: "UDETHUB"
      # hub
      permissions: {
        publish:   { allow: ["lyra.outbound.telegram.>","lyra.outbound.discord.>","lyra.outbound.audio.>","lyra.voice.tts.request","lyra.voice.tts.request.>","lyra.voice.stt.request","lyra.voice.stt.request.>","lyra.llm.generate.request","lyra.image.generate.request","lyra.clipool.cmd","lyra.clipool.control","lyra.audit.>","lyra.turns.write","lyra.typing.>","lyra.event.>","lyra.metric.>","$JS.API.>","$KV.lyra-state.>","$KV.lyra-msg-index.>"] }
