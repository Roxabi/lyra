[project]
name = "roxabi-obs"
version = "0.1.0"
description = "Fleet container self-report reporter for Roxabi plane ③ observability"
readme = "AGENTS.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.12"
authors = [{ name = "Roxabi SAS", email = "mickael@bouly.io" }]
dependencies = [
    "roxabi-contracts>=0.13.0",
    "roxabi-nats>=0.4.2",
]

[project.optional-dependencies]
testing = ["pytest>=8.4", "pytest-asyncio>=0.24"]

[project.urls]
Repository = "https://github.com/Roxabi/roxabi-factory"
Issues = "https://github.com/Roxabi/roxabi-factory/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roxabi_obs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]