name: quality-debt

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]

jobs:
  ratchet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run quality-debt audit
        run: make quality-debt-report || true   # allow non-zero so the ratchet step still runs

      - name: Run quality-debt ratchet
        # CI never sets RATCHET_MODE — uses computed mode based on baseline cutover_date.
        run: tools/check_quality_debt_ratchet.sh
