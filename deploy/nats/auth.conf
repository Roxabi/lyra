      permissions: {
        publish:   { allow: ["lyra.llm.lifecycle.>"] }
        subscribe: { allow: ["_inbox.llm-operator.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETIMAGEWORKER"
      # image-worker
      permissions: {
        publish:   { allow: ["lyra.image.heartbeat","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.image.generate.request","_inbox.image-worker.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETCLIPOOLWORKER"
      # clipool-worker
      permissions: {
        publish:   { allow: ["lyra.clipool.heartbeat","lyra.system.ready","lyra.event.>","lyra.metric.>","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.clipool.cmd","lyra.clipool.control","_inbox.clipool-worker.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETDASHBOARDREADER"
      # dashboard-reader
      permissions: {
        publish:   { allow: [] }
        subscribe: { allow: ["lyra.event.>","lyra.metric.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETVOICECLIENT"
      # voice-client
      permissions: {
        publish:   { allow: ["lyra.voice.stt.request","lyra.voice.tts.request"] }
        subscribe: { allow: ["_inbox.voice-client.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETTURNWRITER"
      # turn-writer
      permissions: {
        publish:   { allow: ["_inbox.turn-writer.>","$JS.API.STREAM.CREATE.LYRA_TURNS","$JS.API.STREAM.INFO.LYRA_TURNS","$JS.API.STREAM.UPDATE.LYRA_TURNS","$JS.API.CONSUMER.CREATE.LYRA_TURNS.turn-writer-v1.>","$JS.API.CONSUMER.INFO.LYRA_TURNS.turn-writer-v1","$JS.API.CONSUMER.MSG.NEXT.LYRA_TURNS.turn-writer-v1"] }
        subscribe: { allow: ["lyra.turns.>","_inbox.turn-writer.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETBLOBSTORE"
      # blobstore
      permissions: {
        publish:   { allow: ["lyra.audit.>","$JS.API.>","$KV.lyra-state.>"] }
        subscribe: { allow: ["_inbox.blobstore.>"] }
        allow_responses: true
      }
    }
  ]
}
