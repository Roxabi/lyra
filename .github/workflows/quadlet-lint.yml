name: Quadlet Lint

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "deploy/quadlet/**"
      - ".github/workflows/quadlet-lint.yml"
  workflow_dispatch: {}

concurrency:
  group: quadlet-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quadlet-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Podman 5.x
        # ubuntu-latest (24.04) ships Podman 4.9.3 which does not recognise the
        # 'Pod=' Quadlet directive (introduced in Podman 5.0).  factory-clipool.container
        # and factory-gh-helper.container both use 'Pod=factory-gh.pod', so the dryrun
        # step fails on the default runner Podman.
        #
        # Fix: pull Podman 5.x from Ubuntu 25.04 (plucky) universe.  We add the
        # plucky apt source with lowest priority (pin = 100) so only the explicitly
        # named packages are upgraded; the rest of the system stays on noble.
        run: |
          set -euo pipefail
          # Add Ubuntu 25.04 (plucky) as a supplementary source at low priority.
          echo "deb https://archive.ubuntu.com/ubuntu plucky main universe" \
            | sudo tee /etc/apt/sources.list.d/plucky.list
          # Pin plucky to priority 100 (below the default 500 for noble) so apt
          # never auto-selects plucky packages for unrelated deps.
          printf 'Package: *\nPin: release n=plucky\nPin-Priority: 100\n' \
            | sudo tee /etc/apt/preferences.d/plucky-pin
          sudo apt-get update -qq
          # Install Podman and its direct runtime deps from plucky with pinned
          # versions for reproducibility (captured from plucky archive 2026-05-07).
          # Update intentionally when upgrading: apt-cache policy podman conmon crun
          sudo apt-get install -y --no-install-recommends \
            -t plucky \
            'podman=5.4.1+ds1-1' \
            'conmon=2.1.12-4' \
            'crun=1.20-1syncable1'
          # Assert the 3 pinned packages are installed at exactly the expected versions.
          # Replaces the awk-based leak detector dropped in #1331 / #1350 — the
          # apt-cache policy parser misfired on runner image 20260518.149+.
          for pkg_ver in 'podman=5.4.1+ds1-1' 'conmon=2.1.12-4' 'crun=1.20-1syncable1'; do
            pkg="${pkg_ver%%=*}"
            want="${pkg_ver#*=}"
            got=$(dpkg-query -W -f='${Version}' "$pkg")
            [[ "$got" == "$want" ]] || { echo "::error::$pkg expected $want, got $got"; exit 1; }
          done
          # Verify we have Podman ≥ 5.x before proceeding (defense-in-depth).
          PODMAN_VERSION=$(podman --version | awk '{print $3}')
          echo "Installed Podman ${PODMAN_VERSION}"
          MAJOR=$(echo "${PODMAN_VERSION}" | cut -d. -f1)
          if [[ "${MAJOR}" -lt 5 ]]; then
            echo "::error::Expected Podman ≥ 5; got ${PODMAN_VERSION}"
            exit 1
          fi

      - name: Quadlet dryrun — parse errors
        env:
          QUADLET_UNIT_DIRS: ${{ github.workspace }}/deploy/quadlet
        run: |
          set -euo pipefail
          # Emit generator logs to stderr; non-zero exit on parse error.
          /usr/libexec/podman/quadlet --dryrun --user 2>&1
          echo "quadlet --dryrun passed"

      - name: Quadlet HealthCmd double-quote check
        # The Quadlet generator silently drops the closing double-quote from
        # HealthCmd= values, producing ["CMD-SHELL","pgrep -f \"factory X"] which
        # /bin/sh rejects with "Syntax error: Unterminated quoted string".
        # All containers report unhealthy indefinitely.  Fix: use /proc/1/cmdline
        # (no quotes needed).  Reject any HealthCmd= containing a double-quote.
        # See issue #1370.
        run: |
          set -euo pipefail
          if grep -nP "HealthCmd=(?!python3 -c ').*\"" deploy/quadlet/*.container; then
            echo "::error::Double-quotes found in HealthCmd= in the above Quadlet unit(s)."
            echo "The Quadlet generator drops the closing quote, producing a broken CMD-SHELL"
            echo "array (/bin/sh: Syntax error: Unterminated quoted string). Use"
            echo "  HealthCmd=grep -q <keyword> /proc/1/cmdline"
            echo "instead (no quotes, no procps dependency). See issue #1370."
            exit 1
          fi
          echo "No double-quotes in HealthCmd= lines — OK"

      - name: Quadlet inline-comment check
        # Quadlet does NOT strip trailing # comments from option values.
        # A line such as:  Volume=foo:bar:z  # comment
        # causes Podman to receive the literal comment as a mount-option string.
        # This step rejects any non-comment line that contains a trailing # comment
        # in a Quadlet unit file (issue #1083 — incident 2026-05-06).
        run: |
          set -euo pipefail
          QUADLET_DIR="deploy/quadlet"
          PATTERN='^\s*[^#;].*[[:space:]]#'
          BAD_FILES=()
          while IFS= read -r -d '' f; do
            if grep -Pn "${PATTERN}" "$f"; then
              BAD_FILES+=("$f")
            fi
          done < <(find "${QUADLET_DIR}" \
              -maxdepth 1 \
              \( -name "*.container" -o -name "*.container.tmpl" -o -name "*.volume" -o -name "*.network" \) \
              -print0)
          if [[ ${#BAD_FILES[@]} -gt 0 ]]; then
            echo ""
            echo "::error::Inline # comments found in Quadlet value lines in: ${BAD_FILES[*]}"
            echo "Quadlet does not strip trailing comments — use a dedicated comment line instead."
            exit 1
          fi
          echo "No inline comments on value lines — OK"

      - name: Template purity check
        # Enforces tracked deploy/quadlet/*.container.tmpl invariants (#1369):
        #  - no `Secret=factory-bot-*` lines (must come from render at install time)
        #  - no `# --- BEGIN ... ---` splice blocks
        #  - tools/render_quadlet.py exists
        run: bash tools/check_quadlet_template_purity.sh
