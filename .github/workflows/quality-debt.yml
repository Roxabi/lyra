name: quality-debt

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]

concurrency:
  group: quality-debt-${{ github.ref }}
  # Cancel only on feature branches; protected branches (main, staging) run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/staging' && github.ref != 'refs/heads/main' }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v7

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run quality-debt audit
        id: audit
        continue-on-error: true
        run: make quality-debt-report
