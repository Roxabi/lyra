        allow_responses: true
      }
    }
    {
      nkey: "UDETTELEGRAMADAPTER"
      # telegram-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.telegram.>","lyra.system.ready","lyra.turns.write","lyra.event.>","lyra.metric.>","$JS.API.DIRECT.GET.LYRA_STATE.hub.ready","$JS.API.INFO","$JS.API.CONSUMER.CREATE.*","$JS.API.STREAM.INFO.KV_lyra-state","$JS.API.STREAM.MSG.GET.KV_lyra-state","$JS.API.STREAM.INFO.LYRA_OUTBOUND_AUDIO","$JS.API.CONSUMER.CREATE.LYRA_OUTBOUND_AUDIO.>","$JS.API.CONSUMER.INFO.LYRA_OUTBOUND_AUDIO.*","$JS.API.CONSUMER.MSG.NEXT.LYRA_OUTBOUND_AUDIO.*","$JS.API.STREAM.INFO.KV_lyra_outbound_audio_sent","$JS.API.STREAM.MSG.GET.KV_lyra_outbound_audio_sent","$JS.ACK.LYRA_OUTBOUND_AUDIO.>","$KV.lyra_outbound_audio_sent.>"] }
        subscribe: { allow: ["lyra.outbound.telegram.>","lyra.outbound.audio.>","lyra.typing.telegram.>","_inbox.telegram-adapter.>","_inbox.telegram-adapter.*.*","$KV.lyra-state.>","$KV.lyra_outbound_audio_sent.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETDISCORDADAPTER"
      # discord-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.discord.>","lyra.system.ready","lyra.turns.write","lyra.event.>","lyra.metric.>","$JS.API.DIRECT.GET.LYRA_STATE.hub.ready","$JS.API.INFO","$JS.API.CONSUMER.CREATE.*","$JS.API.STREAM.INFO.KV_lyra-state","$JS.API.STREAM.MSG.GET.KV_lyra-state","$JS.API.STREAM.INFO.LYRA_OUTBOUND_AUDIO","$JS.API.CONSUMER.CREATE.LYRA_OUTBOUND_AUDIO.>","$JS.API.CONSUMER.INFO.LYRA_OUTBOUND_AUDIO.*","$JS.API.CONSUMER.MSG.NEXT.LYRA_OUTBOUND_AUDIO.*","$JS.API.STREAM.INFO.KV_lyra_outbound_audio_sent","$JS.API.STREAM.MSG.GET.KV_lyra_outbound_audio_sent","$JS.ACK.LYRA_OUTBOUND_AUDIO.>","$KV.lyra_outbound_audio_sent.>"] }
        subscribe: { allow: ["lyra.outbound.discord.>","lyra.outbound.audio.>","lyra.typing.discord.>","_inbox.discord-adapter.>","_inbox.discord-adapter.*.*","$KV.lyra-state.>","$KV.lyra_outbound_audio_sent.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETVOICETTS"
