name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}  # dispatch resolves from default branch — per-branch re-triggers require the branch to contain a compatible ci.yml

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only on feature branches; protected branches (main, staging) run to completion so every merge-commit SHA has a recorded status.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: sudo apt-get install -y portaudio19-dev

      - name: Install nats-server
        env:
          NATS_VERSION: "2.10.22"
        run: |
          ARCH=$(dpkg --print-architecture)
          TARBALL="nats-server-v${NATS_VERSION}-linux-${ARCH}.tar.gz"
          TMPDIR=$(mktemp -d)
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/${TARBALL}" \
            -o "${TMPDIR}/${TARBALL}"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/SHA256SUMS" \
            -o "${TMPDIR}/SHA256SUMS"
          cd "${TMPDIR}" && grep -F "${TARBALL}" SHA256SUMS | sha256sum --check
          tar -xzf "${TMPDIR}/${TARBALL}" -C "${TMPDIR}"
          sudo install -m 755 "${TMPDIR}/nats-server-v${NATS_VERSION}-linux-${ARCH}/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Install nk
        env:
          NK_VERSION: "0.4.15"
        run: |
          ARCH=$(dpkg --print-architecture)
          ZIPFILE="nkeys-v${NK_VERSION}-linux-${ARCH}.zip"
          TMPDIR=$(mktemp -d)
          curl -fsSL "https://github.com/nats-io/nkeys/releases/download/v${NK_VERSION}/${ZIPFILE}" \
            -o "${TMPDIR}/${ZIPFILE}"
          curl -fsSL "https://github.com/nats-io/nkeys/releases/download/v${NK_VERSION}/nkeys-v${NK_VERSION}-checksums.txt" \
            -o "${TMPDIR}/checksums.txt"
          cd "${TMPDIR}" && grep -F "${ZIPFILE}" checksums.txt | sha256sum --check
          unzip -q "${TMPDIR}/${ZIPFILE}" -d "${TMPDIR}"
          sudo install -m 755 "${TMPDIR}/nkeys-v${NK_VERSION}-linux-${ARCH}/nk" /usr/local/bin/nk
          nk -v

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # stack.yml gates: dashboard_build, lint_js, dashboard_unit_test
      - name: Dashboard SPA build + lint (#1771)
        run: |
          bun install --frozen-lockfile
          bun run build:dashboard
          bun run lint
          bun run --filter @roxabi-factory/dashboard test
          test -f apps/dashboard/dist/index.html

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
          uv sync --frozen --package roxabi-contracts --extra testing

      - name: Check file length
        run: bash tools/check_file_length.sh

      - name: "Check file exemption expiry (stale exemptions without valid date)"
        run: bash tools/check_file_exemptions.sh

      - name: "Check hardcoded constants (new numeric literals in src/factory/core/)"
        run: bash tools/check_hardcoded_constants.sh

      - name: "Check bus-bound str(exc) (SanitizedError discipline #1212, ADR-073)"
        run: bash tools/check_str_exc_bus_bound.sh

      - name: Test hardcoded-constants gate
        run: bash tests/tools/test_check_hardcoded_constants.sh

      - name: "Check omp pin lockstep (omp-base / Dockerfile / _PINNED_SHA256, #1873)"
        run: bash tools/check_omp_pin_lockstep.sh

      - name: Test omp-pin-lockstep gate
        run: bash tests/tools/test_check_omp_pin_lockstep.sh

      - name: Check qg.conf drift (stack.yml is source of truth)
        run: bash scripts/check-qg-conf-drift.sh

      - name: Check duplicate test basenames
        run: bash tools/check_duplicate_test_basenames.sh

      - name: Check folder size
        run: bash tools/check_folder_size.sh

      - name: Check no runtime TOML bots
        run: bash tools/check_no_runtime_toml_bots.sh

      - name: Check ACL matrix lifecycle fields
        run: uv run factory-check-acl-retired

      - name: Check request-reply flows
        run: uv run factory-check-flows

      - name: Check ACL code coverage (ADR-079)
        run: uv run factory-acl check grants --matrix deploy/nats/acl-matrix.json

      - name: Check auth.conf drift (acl-matrix.json is source of truth)
        run: bash scripts/check-acl-authconf-drift.sh

      - name: Check ACL spec/fixture drift (acl-matrix.json is source of truth)
        run: bash scripts/check-acl-specs-drift.sh

      - name: Check inbox_prefix uses identity_name API
        run: uv run python scripts/check_inbox_prefix.py

      - name: Check subject literals resolve (acl-matrix + contracts)
        run: uv run python scripts/check_subject_literals.py

      - name: Check docs drift — removed symbols must not reappear
        run: |
          set -euo pipefail
          if find docs/ -name "*.md" ! -path "*/architecture/*" | xargs grep -n "FACTORY_LOG_DIR\|json_file\s*=\|RotatingFileHandler"; then
            echo "::error::Removed symbols found in operator docs — update docs to match current code"
            exit 1
          fi
          uv run python tools/check_doc_drift.py
          uv run python tools/check_doc_semantic_drift.py

      - name: Check secrets drift (unit Secret= / quadlet.toml / manifest / acl-matrix)
        run: bash tools/check_secrets_drift.sh

      - name: Check quadlet manifest install wiring (quadlet.toml → Makefile/verify/converge)
        run: bash tools/check_quadlet_manifest_install.sh

      - name: Check deployment.md Volumes table matches quadlet Volume= directives
        run: bash tools/check_volumes_table.sh

      - name: Check architecture snapshot freshness
        run: bash tools/check_architecture_snapshot.sh

      - name: "Check debt expiry (stale DEBT: markers)"
        run: bash tools/check_debt_expiry.sh

      - name: "Check test sleep (raw sleep without sync comment)"
        run: bash tools/check_test_sleep.sh

      - name: Enforce import layers
        run: uv run lint-imports

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

      - name: License check
        run: uv run tools/license_check.py

      - name: Verify error codes registry sync
        run: |
          uv run python packages/roxabi-contracts/scripts/check_codes_sync.py || EC=$?
          [[ ${EC:-0} -eq 0 || ${EC:-0} -eq 2 ]] || exit "${EC:-1}"

      - name: Dashboard visual e2e (#1771)
        run: |
          uv run playwright install chromium
          uv run pytest tests/e2e/dashboard/ -v

      - name: Coverage — factory
        run: uv run pytest tests/ --cov=factory --cov-branch --cov-report=term-missing --cov-fail-under=50

      - name: Coverage — roxabi_nats
        run: uv run pytest packages/roxabi-nats/tests --cov=roxabi_nats --cov-branch --cov-report=term-missing --cov-fail-under=70

      - name: Coverage — roxabi_contracts
        run: uv run pytest packages/roxabi-contracts/tests --cov=roxabi_contracts --cov-branch --cov-report=term-missing --cov-fail-under=80

  integration:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        typing_enabled: ["true", "false"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Start Docker integration environment
        run: docker compose -f docker/docker-compose.test.yml up -d --wait --wait-timeout 60

      - name: Run integration tests
        env:
          NATS_URL: nats://localhost:4222
          FACTORY_TYPING_ENABLED: ${{ matrix.typing_enabled }}
        run: uv run pytest tests/integration/ -v

      - name: Tear down Docker environment
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  docker-build:
    # Build-only gate: verifies the Dockerfile compiles on every PR.
    # Runs in parallel with ci/integration (no needs:).
    # Does NOT push. Uses CI-scoped GHA cache (factory-agent-ci / factory-svc-ci)
    # so it never pollutes the publish job's factory-agent / factory-svc scopes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read  # pull ghcr.io/roxabi/base* base images
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (no push)
        uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          files: docker-bake.hcl
          push: false
          set: |
            *.cache-from=type=gha,scope=factory-agent-ci
            *.cache-to=type=gha,mode=min,scope=factory-agent-ci
            svc-runtime.cache-from=type=gha,scope=factory-svc-ci
            svc-runtime.cache-to=type=gha,mode=min,scope=factory-svc-ci
