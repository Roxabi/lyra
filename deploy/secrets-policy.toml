# deploy/secrets-policy.toml — factory secret policy registry
#
# Defines policy + source for every Podman secret used by factory containers.
# This is a *sibling* to deploy/quadlet.toml (declared SSoT per S2):
#   - quadlet.toml  required_secrets: which secrets each component needs
#   - secrets-policy.toml:            what each secret IS and where it comes from
#
# policy values:
#   nats-seed        NKey seed file — generated by `factory-acl genkeys`
#   generated        Random bearer token — generated at install time (openssl rand)
#   optional         External credential — must be provisioned manually; missing = skip, not error
#   bot-provisioned  Dynamic bot credential — rendered at install from config.toml by
#                    tools/render_quadlet.py; no canonical seed file; installed via
#                    `factory bot secret install <platform> <bot_id>`
#
# secret-class sections (e.g. [secret-class.X]) declare dynamic name families whose
# members are generated at install time and are NOT enumerated in required_secrets.
# They are parsed under data["secret-class"], not data["secret"], so they are naturally
# excluded from the check (d) bidirectional assertion in check_secrets_drift.sh.
#
# source: path relative to the factory data dir (~/.roxabi/factory/)
#         use literal "n/a" for secrets with no file-based source (e.g. generated at runtime)

# ── NATS NKey seeds (one per factory container identity) ─────────────────────

[secret.factory-nats-hub]
policy = "nats-seed"
source = "nkeys/hub.seed"

[secret.factory-nats-telegram]
policy = "nats-seed"
source = "nkeys/telegram-adapter.seed"

[secret.factory-nats-discord]
policy = "nats-seed"
source = "nkeys/discord-adapter.seed"

[secret.factory-nats-web]
policy = "nats-seed"
source = "nkeys/web-adapter.seed"

[secret.factory-nats-clipool]
policy = "nats-seed"
source = "nkeys/clipool-worker.seed"

[secret.factory-nats-turn-writer]
policy = "nats-seed"
source = "nkeys/turn-writer.seed"

[secret.factory-nats-blobstore]
policy = "nats-seed"
source = "nkeys/blobstore.seed"

[secret.factory-nats-gh-helper]
policy = "nats-seed"
source = "nkeys/gh-helper.seed"

[secret.factory-nats-omp]
policy = "nats-seed"
source = "nkeys/omp-worker.seed"

[secret.factory-nats-socialmedia]
policy = "nats-seed"
source = "nkeys/socialmedia-adapter.seed"

[secret.factory-nats-ingress]
policy = "nats-seed"
source = "nkeys/ingress.seed"

# ── Bearer tokens / API credentials ──────────────────────────────────────────

[secret.factory_blobstore_token]
policy = "generated"
source = "n/a"

[secret.factory_otel_token]
policy = "generated"
source = "n/a"

# ── Optional external credentials ─────────────────────────────────────────────

[secret.factory-gh-pem]
policy = "optional"
source = "gh-app.pem"

[secret.factory-claude-oauth]
policy = "optional"
source = "claude-oauth.tok"

[secret.factory-litellm-key]
policy = "optional"
source = "litellm-key.tok"

[secret.factory-socialmedia-api-key]
policy = "optional"
source = "socialmedia-api-key.tok"

[secret.factory-ingress-github-webhook]
policy = "optional"
source = "ingress-github-webhook.tok"

[secret.factory-ingress-cloudflare-webhook]
policy = "optional"
source = "ingress-cloudflare-webhook.tok"

# ── Dynamic secret classes (rendered at install, not enumerated in required_secrets) ─────

# Bot API tokens: one per configured bot per platform.
# Name pattern: factory-bot-{platform}-{bot_id}
#               factory-bot-{platform}-{bot_id}-webhook  (when webhook_enabled=True)
# Generated by: tools/render_quadlet.py reading BotStore (~/.roxabi/factory/config.db)
# Installed by: `factory bot secret install <platform> <bot_id>` (host-local, per-bot)
# No canonical seed file — provisioned by the operator from the platform's bot-father token.
[secret-class.bot-token]
pattern = "factory-bot-{platform}-{bot_id}"
policy = "bot-provisioned"
source = "n/a"

# Ingress per-tenant webhook secrets (Family B connectors — Cloudflare, etc.).
# Pattern: factory-ingress-{connector}-{factory_tenant}-webhook
# Generated at provision time; NOT enumerated in required_secrets (ADR-096).
# V1 uses static Podman secrets for default tenant only.
# [secret-class.ingress-tenant]
# pattern = "factory-ingress-{connector}-{factory_tenant}-webhook"
# policy = "optional"
# source = "n/a"
