name: publish
on:
  # Gate staging pushes on CI success. After landing-path classify, a processed
  # PR merge still concludes CI success (suite skipped; aggregate `ci` stays green)
  # so images still publish — no second suite. workflow_run does NOT fire on tag
  # pushes; the release-tag path is the separate push:tags trigger below.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [staging]
  push:
    tags: ['factory/v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    # workflow_run path: proceed ONLY when CI passed, the triggering run was a PUSH (not a PR),
    # and it came from THIS repo (not a fork) — a fork PR must never get its code published under
    # this repo's packages:write token. Direct tag push (factory/v*) always proceeds.
    if: >
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # workflow_run runs at default-branch HEAD; check out the triggering commit.
          # For direct tag push, github.sha is already correct.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          REG=ghcr.io/roxabi/factory
          # GITHUB_REF points at the default branch under workflow_run, so it cannot route
          # tag-vs-staging. Use the triggering run's head_branch (empty on a direct tag push,
          # where event_name=push and GITHUB_REF_NAME is the tag).
          EFF="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          if [[ "$EFF" == "staging" ]]; then
            {
              echo "bake_set<<EOF"
              echo "agent-runtime.tags=${REG}:staging"
              echo "svc-runtime.tags=${REG}:staging-svc"
              echo "EOF"
              echo "svc_tag=${REG}:staging-svc"
            } >> "$GITHUB_OUTPUT"
          else
            full="${GITHUB_REF_NAME}"
            ver="${full#*/v}"
            major="${ver%%.*}"
            {
              echo "bake_set<<EOF"
              echo "agent-runtime.tags=${REG}:${ver},${REG}:${major},${REG}:latest"
              # svc-runtime intentionally omits a :latest-svc equivalent — Quadlet units pin to specific tags
              echo "svc-runtime.tags=${REG}:${ver}-svc,${REG}:${major}-svc"
              echo "EOF"
              echo "svc_tag=${REG}:${ver}-svc"
            } >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/bake-action@6614cfa25eff9a0b2b2697efb0b6159e7680d584 # v7.2.0
        with:
          files: docker-bake.hcl
          push: true
          # bake-action auto-injects `--set *.attest=type=provenance,mode=max` on GHA push events,
          # which OVERRIDES docker-bake.hcl's `provenance = false` and re-adds a per-build attestation
          # manifest whose metadata churns the pushed OCI index digest — defeating lot 4a (the digest
          # must be content-addressed so a docs-only commit does not move fingerprint fields 4/5).
          # These action-level inputs are what actually disable it (audit 2026-07-01, lot 4a fix).
          provenance: false
          sbom: false
          set: |
            ${{ steps.tags.outputs.bake_set }}
            *.labels.org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            *.labels.org.opencontainers.image.version=${{ github.ref_name }}

      - name: Verify forbidden binaries absent (SC-3)
        run: |
          docker run --rm ${{ steps.tags.outputs.svc_tag }} \
            sh -c 'which bun claude corepack node factory-gh 2>/dev/null && exit 1 || exit 0'

      - name: Verify dashboard SPA embedded in svc-runtime (#1771)
        run: |
          docker run --rm ${{ steps.tags.outputs.svc_tag }} \
            sh -c 'test -f /app/apps/dashboard-v2/dist/index.html'
