# NATS nkey authorization — generated by lyra-acl genkeys
# Spec: artifacts/specs/706-per-role-nkeys-acls-spec.mdx
# TODO(ADR-045): ACL for roxabi-nats SDK identities intentionally omitted
#                until the SDK extraction lands — rerun this script then.
# DO NOT edit manually — regenerate with: sudo env "PATH=$PATH" lyra-acl genkeys --regenerate
authorization {
  default_permissions: {
    publish:   { deny: [">"] }
    subscribe: { deny: [">"] }
  }
  users: [
    {
      nkey: "UDETHUB"
      # hub
      permissions: {
        publish:   { allow: ["lyra.outbound.telegram.>","lyra.outbound.discord.>","lyra.voice.tts.request.>","lyra.voice.stt.request.>","lyra.llm.generate.request","lyra.image.generate.request","lyra.clipool.cmd","lyra.clipool.control","lyra.audit.>","lyra.turns.write","$JS.API.>","$KV.lyra-state.>"] }
        subscribe: { allow: ["lyra.inbound.telegram.>","lyra.inbound.discord.>","lyra.voice.tts.heartbeat","lyra.voice.stt.heartbeat","lyra.llm.heartbeat","lyra.system.ready","lyra.image.heartbeat","lyra.clipool.heartbeat","_inbox.hub.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETTELEGRAMADAPTER"
      # telegram-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.telegram.>","lyra.system.ready","lyra.turns.write","$JS.API.>"] }
        subscribe: { allow: ["lyra.outbound.telegram.>","_inbox.telegram-adapter.>","_inbox.telegram-adapter.*.*","$KV.lyra-state.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETDISCORDADAPTER"
      # discord-adapter
      permissions: {
        publish:   { allow: ["lyra.inbound.discord.>","lyra.system.ready","lyra.turns.write","$JS.API.>"] }
        subscribe: { allow: ["lyra.outbound.discord.>","_inbox.discord-adapter.>","_inbox.discord-adapter.*.*","$KV.lyra-state.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETVOICETTS"
      # voice-tts
      permissions: {
        publish:   { allow: ["lyra.voice.tts.heartbeat","lyra.system.ready","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.voice.tts.request","lyra.voice.tts.request.>","_inbox.voice-tts.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETVOICESTT"
      # voice-stt
      permissions: {
        publish:   { allow: ["lyra.voice.stt.heartbeat","lyra.system.ready","$JS.API.>","_inbox.hub.>","_inbox.voice-client.>"] }
        subscribe: { allow: ["lyra.voice.stt.request","lyra.voice.stt.request.>","_inbox.voice-stt.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETLLMWORKER"
      # llm-worker
      permissions: {
        publish:   { allow: ["lyra.llm.heartbeat","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.llm.generate.request","lyra.llm.lifecycle.>","_inbox.llmcli-llm.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETLLMOPERATOR"
      # llm-operator
      permissions: {
        publish:   { allow: ["lyra.llm.lifecycle.>"] }
        subscribe: { allow: ["_inbox.llm-operator.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETIMAGEWORKER"
      # image-worker
      permissions: {
        publish:   { allow: ["lyra.image.heartbeat","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.image.generate.request","_inbox.image-worker.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETMONITOR"
      # monitor
      permissions: {
        publish:   { allow: ["lyra.monitor.>"] }
        subscribe: { allow: ["lyra.monitor.>"] }
        allow_responses: false
      }
    }
    {
      nkey: "UDETCLIPOOLWORKER"
      # clipool-worker
      permissions: {
        publish:   { allow: ["lyra.clipool.heartbeat","lyra.system.ready","$JS.API.>","_inbox.hub.>"] }
        subscribe: { allow: ["lyra.clipool.cmd","lyra.clipool.control","_inbox.clipool-worker.>","$KV.lyra-state.>"] }
        allow_responses: true
      }
    }
    {
      nkey: "UDETVOICECLIENT"
      # voice-client
      permissions: {
        publish:   { allow: ["lyra.voice.stt.request"] }
        subscribe: { allow: ["_inbox.voice-client.>"] }
        allow_responses: true
      }
    }
    {
      # T27 (#1331): turn-writer — sole writer for turns.db via NATS JetStream.
      # nkey public key bound to the lyra-nats-turn-writer Podman secret (provisioned
      # by deploy/install.sh T25). Replace UDET_TURN_WRITER_PLACEHOLDER with the
      # actual public nkey after running: lyra-acl genkeys --add turn-writer
      nkey: "UDET_TURN_WRITER_PLACEHOLDER"
      # turn-writer
      permissions: {
        publish:   { allow: ["_INBOX.>"] }
        subscribe: { allow: [
          "lyra.turns.>",
          "_INBOX.>",
          "$JS.API.STREAM.CREATE.LYRA_TURNS",
          "$JS.API.STREAM.INFO.LYRA_TURNS",
          "$JS.API.CONSUMER.CREATE.LYRA_TURNS.turn-writer-v1",
          "$JS.API.CONSUMER.INFO.LYRA_TURNS.turn-writer-v1",
          "$JS.API.CONSUMER.MSG.NEXT.LYRA_TURNS.turn-writer-v1"
        ] }
        allow_responses: true
      }
    }
  ]
}
