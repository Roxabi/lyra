name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch: {}  # dispatch resolves from default branch — per-branch re-triggers require the branch to contain a compatible ci.yml

concurrency:
  group: ci-${{ github.ref }}
  # Cancel only on feature branches; protected branches (main, staging) run to completion so every merge-commit SHA has a recorded status.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/staging' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install system dependencies
        run: sudo apt-get install -y portaudio19-dev

      - name: Install nats-server
        env:
          NATS_VERSION: "2.10.22"
        run: |
          ARCH=$(dpkg --print-architecture)
          TARBALL="nats-server-v${NATS_VERSION}-linux-${ARCH}.tar.gz"
          TMPDIR=$(mktemp -d)
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/${TARBALL}" \
            -o "${TMPDIR}/${TARBALL}"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/v${NATS_VERSION}/SHA256SUMS" \
            -o "${TMPDIR}/SHA256SUMS"
          cd "${TMPDIR}" && grep -F "${TARBALL}" SHA256SUMS | sha256sum --check
          tar -xzf "${TMPDIR}/${TARBALL}" -C "${TMPDIR}"
          sudo install -m 755 "${TMPDIR}/nats-server-v${NATS_VERSION}-linux-${ARCH}/nats-server" /usr/local/bin/nats-server
          nats-server --version

      - name: Install nk
        env:
          NK_VERSION: "0.4.15"
        run: |
          ARCH=$(dpkg --print-architecture)
          ZIPFILE="nkeys-v${NK_VERSION}-linux-${ARCH}.zip"
          TMPDIR=$(mktemp -d)
          curl -fsSL "https://github.com/nats-io/nkeys/releases/download/v${NK_VERSION}/${ZIPFILE}" \
            -o "${TMPDIR}/${ZIPFILE}"
          curl -fsSL "https://github.com/nats-io/nkeys/releases/download/v${NK_VERSION}/nkeys-v${NK_VERSION}-checksums.txt" \
            -o "${TMPDIR}/checksums.txt"
          cd "${TMPDIR}" && grep -F "${ZIPFILE}" checksums.txt | sha256sum --check
          unzip -q "${TMPDIR}/${ZIPFILE}" -d "${TMPDIR}"
          sudo install -m 755 "${TMPDIR}/nkeys-v${NK_VERSION}-linux-${ARCH}/nk" /usr/local/bin/nk
          nk -v

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v7

      - name: Install dependencies
        run: |
          uv sync --frozen --group dev
          uv sync --frozen --package roxabi-contracts --extra testing

      - name: Check file length
        run: bash tools/check_file_length.sh

      - name: Check duplicate test basenames
        run: bash tools/check_duplicate_test_basenames.sh

      - name: Check ACL matrix lifecycle fields
        run: uv run lyra-check-acl-retired

      - name: Check request-reply flows
        run: uv run lyra-check-flows

      - name: Check ACL code coverage (ADR-079)
        run: uv run lyra-acl check grants --matrix deploy/nats/acl-matrix.json

      - name: Check auth.conf drift (acl-matrix.json is source of truth)
        run: bash scripts/check-acl-authconf-drift.sh

      - name: Check ACL spec/fixture drift (acl-matrix.json is source of truth)
        run: bash scripts/check-acl-specs-drift.sh

      - name: Check inbox_prefix uses identity_name API
        run: uv run python scripts/check_inbox_prefix.py

      - name: Check subject literals resolve (acl-matrix + contracts)
        run: uv run python scripts/check_subject_literals.py

      - name: Check docs drift — removed symbols must not reappear
        run: |
          set -euo pipefail
          if find docs/ -name "*.md" ! -path "*/architecture/*" | xargs grep -n "LYRA_LOG_DIR\|json_file\s*=\|RotatingFileHandler"; then
            echo "::error::Removed symbols found in operator docs — update docs to match current code"
            exit 1
          fi
          uv run python tools/check_doc_drift.py

      - name: Check architecture snapshot freshness
        run: bash tools/check_architecture_snapshot.sh

      - name: Enforce import layers
        run: uv run lint-imports

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright

      - name: Verify error codes registry sync
        run: |
          uv run python packages/roxabi-contracts/scripts/check_codes_sync.py || EC=$?
          [[ ${EC:-0} -eq 0 || ${EC:-0} -eq 2 ]] || exit "${EC:-1}"

      - name: Coverage — lyra
        run: uv run pytest tests/ --cov=lyra --cov-branch --cov-report=term-missing --cov-fail-under=50

      - name: Coverage — roxabi_nats
        run: uv run pytest packages/roxabi-nats/tests --cov=roxabi_nats --cov-branch --cov-report=term-missing --cov-fail-under=70

      - name: Coverage — roxabi_contracts
        run: uv run pytest packages/roxabi-contracts/tests --cov=roxabi_contracts --cov-branch --cov-report=term-missing --cov-fail-under=80

  integration:
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        typing_enabled: ["true", "false"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v7

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Start Docker integration environment
        run: docker compose -f docker/docker-compose.test.yml up -d --wait --wait-timeout 60

      - name: Run integration tests
        env:
          NATS_URL: nats://localhost:4222
          LYRA_TYPING_ENABLED: ${{ matrix.typing_enabled }}
        run: uv run pytest tests/integration/ -v

      - name: Tear down Docker environment
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  integration-report:
    name: integration
    needs: [integration]
    runs-on: ubuntu-latest
    steps:
      - name: Report success
        run: echo "Integration tests passed"
