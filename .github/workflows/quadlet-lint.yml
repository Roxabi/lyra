name: Quadlet Lint

permissions:
  contents: read

on:
  pull_request:
    branches: [main, staging]
    paths:
      - "deploy/quadlet/**"
  workflow_dispatch: {}

concurrency:
  group: quadlet-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quadlet-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install Podman 5.x
        # ubuntu-latest (24.04) ships Podman 4.9.3 which does not recognise the
        # 'Pod=' Quadlet directive (introduced in Podman 5.0).  lyra-clipool.container
        # and lyra-gh-helper.container both use 'Pod=lyra-gh.pod', so the dryrun
        # step fails on the default runner Podman.
        #
        # Fix: pull Podman 5.x from Ubuntu 25.04 (plucky) universe.  We add the
        # plucky apt source with lowest priority (pin = 100) so only the explicitly
        # named packages are upgraded; the rest of the system stays on noble.
        run: |
          set -euo pipefail
          # Add Ubuntu 25.04 (plucky) as a supplementary source at low priority.
          echo "deb https://archive.ubuntu.com/ubuntu plucky main universe" \
            | sudo tee /etc/apt/sources.list.d/plucky.list
          # Pin plucky to priority 100 (below the default 500 for noble) so apt
          # never auto-selects plucky packages for unrelated deps.
          printf 'Package: *\nPin: release n=plucky\nPin-Priority: 100\n' \
            | sudo tee /etc/apt/preferences.d/plucky-pin
          sudo apt-get update -qq
          # Install Podman and its direct runtime deps from plucky with pinned
          # versions for reproducibility (captured from plucky archive 2026-05-07).
          # Update intentionally when upgrading: apt-cache policy podman conmon crun
          sudo apt-get install -y --no-install-recommends \
            -t plucky \
            'podman=5.4.1+ds1-1' \
            'conmon=2.1.12-4' \
            'crun=1.20-1syncable1'
          # Assert no other plucky packages leaked in via transitive deps.
          # Gather full apt-cache policy output in one batch call (no -I{} to
          # avoid one subprocess per package; xargs batches all names at once).
          RAW=$(dpkg-query -W -f='${Package}\n' \
            | xargs apt-cache policy 2>/dev/null)
          # Stateful awk over the full stream — no grep -B context window needed.
          # apt-cache policy format (exact indentation matters):
          #   podman:                          ← package header (no leading whitespace, ends in ':')
          #     Installed: 5.4.1+ds1-1
          #     Version table:
          #    *** 5.4.1+ds1-1 100            ← active candidate (1 leading space + ***)
          #           100 https://.../plucky  ← archive source (8 leading spaces)
          #        4.9.0 500                  ← non-active version (5 leading spaces + non-space)
          #           500 https://.../noble
          # Rules:
          #   - New package: line with no leading whitespace ending in ':'  → reset state
          #   - Active candidate: " *** ..."                                → set in_cand=1
          #   - Non-active version: "     <non-space>..."                   → set in_cand=0
          #   - Archive line while in_cand && contains "plucky"             → print pkg (once)
          PLUCKY_PKGS=$(printf '%s\n' "${RAW}" \
            | awk '/^[^ \t].*:$/ { pkg = $0; sub(/:$/, "", pkg); in_cand = 0; next }
                   /^ \*\*\*/     { in_cand = 1; next }
                   /^     [^ ]/   { in_cand = 0; next }
                   in_cand && /plucky/ { print pkg; in_cand = 0 }')
          # grep -Fxv exits 1 when all lines are excluded (list is clean) — that
          # is the expected happy path, so || true is scoped only to this step.
          # Allowlist: 3 pinned packages + transitive runtime deps from plucky.
          # libgpg-error*, libgpgme11t64, apport-symptoms leak in because
          # podman 5.4.1 links against newer libgpgme (observed 2026-05-25, #1350).
          # Re-audit when bumping the pinned podman/conmon/crun versions.
          PLUCKY_EXTRA=$(printf '%s\n' "${PLUCKY_PKGS}" \
            | grep -Fxv \
                -e podman -e conmon -e crun \
                -e apport-symptoms \
                -e libgpg-error-l10n -e libgpg-error0 \
                -e libgpgme11t64 || true)
          if [[ -n "${PLUCKY_EXTRA}" ]]; then
            echo "::error::Unexpected plucky packages installed: ${PLUCKY_EXTRA}"
            exit 1
          fi
          # Verify we have Podman ≥ 5.x before proceeding.
          PODMAN_VERSION=$(podman --version | awk '{print $3}')
          echo "Installed Podman ${PODMAN_VERSION}"
          MAJOR=$(echo "${PODMAN_VERSION}" | cut -d. -f1)
          if [[ "${MAJOR}" -lt 5 ]]; then
            echo "::error::Expected Podman ≥ 5; got ${PODMAN_VERSION}"
            exit 1
          fi

      - name: Quadlet dryrun — parse errors
        env:
          QUADLET_UNIT_DIRS: ${{ github.workspace }}/deploy/quadlet
        run: |
          set -euo pipefail
          # Emit generator logs to stderr; non-zero exit on parse error.
          /usr/libexec/podman/quadlet --dryrun --user 2>&1
          echo "quadlet --dryrun passed"

      - name: Quadlet inline-comment check
        # Quadlet does NOT strip trailing # comments from option values.
        # A line such as:  Volume=foo:bar:z  # comment
        # causes Podman to receive the literal comment as a mount-option string.
        # This step rejects any non-comment line that contains a trailing # comment
        # in a Quadlet unit file (issue #1083 — incident 2026-05-06).
        run: |
          set -euo pipefail
          QUADLET_DIR="deploy/quadlet"
          PATTERN='^\s*[^#;].*[[:space:]]#'
          BAD_FILES=()
          while IFS= read -r -d '' f; do
            if grep -Pn "${PATTERN}" "$f"; then
              BAD_FILES+=("$f")
            fi
          done < <(find "${QUADLET_DIR}" \
              -maxdepth 1 \
              \( -name "*.container" -o -name "*.volume" -o -name "*.network" \) \
              -print0)
          if [[ ${#BAD_FILES[@]} -gt 0 ]]; then
            echo ""
            echo "::error::Inline # comments found in Quadlet value lines in: ${BAD_FILES[*]}"
            echo "Quadlet does not strip trailing comments — use a dedicated comment line instead."
            exit 1
          fi
          echo "No inline comments on value lines — OK"
