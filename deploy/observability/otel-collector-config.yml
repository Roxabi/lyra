# DEPRECATED — factory-otel-collector disabled in quadlet.toml (2026-06-30).
# OTLP ingest now handled by factory-otel (src/factory/otel/). Kept for rollback.
# Langfuse exporter removed in v1 — optional stack may be re-enabled later.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 64

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

exporters:
  file:
    path: /otel-data/spans.jsonl

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file]